<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Leads Hyundai</title><style>body{font:16px system-ui;background:#f4f7fb;color:#142033;margin:0}.wrap{max-width:900px;margin:auto;padding:22px}section{background:white;padding:20px;border-radius:14px;margin:14px 0}input,button,select{font:inherit;padding:11px;border-radius:8px;border:1px solid #ccd5e0}input{width:95%;margin:8px 0}button{background:#002c5f;color:white;font-weight:bold}.lead{padding:14px 0;border-top:1px solid #ddd;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{font-size:12px;color:#667085}.hide{display:none}</style><div class="wrap"><h1>Dashboard Leads Hyundai</h1><p class="muted">Halaman admin. Ganti password default sebelum publikasi.</p><section id="login"><h2>Login Admin</h2><input id="pass" type="password" placeholder="Password admin"><button onclick="login()">Masuk</button><p id="err"></p></section><section id="dash" class="hide"><button onclick="load()">Muat Ulang</button> <button onclick="location.reload()">Keluar</button><p id="count"></p><div id="rows"></div></section></div><script>let token="";async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pass").value})}),d=await r.json();if(!r.ok){err.textContent=d.error;return}token=d.token;loginBox();load()}function loginBox(){document.getElementById("login").classList.add("hide");document.getElementById("dash").classList.remove("hide")}async function load(){let r=await fetch("/api/admin/leads",{headers:{Authorization:"Bearer "+token}});if(!r.ok)return;let a=await r.json();count.textContent=a.length+" leads";rows.innerHTML="";a.forEach(x=>{let el=document.createElement("div");el.className="lead";let left=document.createElement("div");left.innerHTML="<b></b><div></div><div></div><small></small>";left.children[0].textContent=x.name+" • "+x.phone;left.children[1].textContent=x.model+" — "+x.need;left.children[2].textContent=x.message;left.children[3].textContent=new Date(x.createdAt).toLocaleString("id-ID");let sel=document.createElement("select");["Baru","Dihubungi","Follow-up","Deal","Tidak lanjut"].forEach(s=>{let o=document.createElement("option");o.textContent=s;o.value=s;o.selected=x.status===s;sel.appendChild(o)});sel.onchange=()=>fetch("/api/admin/leads/"+x.id,{method:"PATCH",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({status:sel.value})});el.append(left,sel);rows.append(el)})}</script></html>
